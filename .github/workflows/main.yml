name: Publish Package to npmjs
on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Setup .npmrc file to publish to npm
      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      - name: Check release version
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';

          const manifest = JSON.parse(readFileSync('package.json', 'utf8'));
          const lockfile = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          assert.equal(lockfile.version, manifest.version, 'Lockfile version must match package.json');
          assert.equal(lockfile.packages[''].version, manifest.version, 'Root lockfile version must match package.json');
          assert.equal(process.env.GITHUB_REF_NAME, `v${manifest.version}`, 'Release tag must match package.json');
          JS
      - name: Update npm
        run: npm install -g npm@latest
      - name: Install locked dependencies with optional Rollup binary
        run: npm ci --include=optional
      - name: Check Linux Rollup binary
        run: node -e "require('@rollup/rollup-linux-x64-gnu')"
      - run: npm run build
      - name: Pack and check npm archive
        id: package
        run: |
          archive="$RUNNER_TEMP/$(npm pack --ignore-scripts --silent --pack-destination "$RUNNER_TEMP")"
          npm run check:package -- "$archive"
          echo "archive=$archive" >> "$GITHUB_OUTPUT"
      - name: Publish checked archive
        env:
          PACKAGE_ARCHIVE: ${{ steps.package.outputs.archive }}
        run: npm publish "$PACKAGE_ARCHIVE"
